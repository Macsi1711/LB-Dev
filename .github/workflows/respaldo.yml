name: Respaldo

# Respaldo de la base y las fotos en Cloudflare R2, fuera de Supabase, y prueba mensual de que
# se puede restaurar (docs/respaldo.md, ADR-009). Si falla, GitHub le manda un mail a quien
# editó por última vez este archivo.
on:
  schedule:
    - cron: '0 6 * * *' # todas las noches, 03:00 en Argentina
    - cron: '0 12 1 * *' # el día 1 de cada mes, 09:00 en Argentina: prueba de restauración
  workflow_dispatch:
    inputs:
      tarea:
        description: Qué correr
        type: choice
        options: [respaldar, probar]
        default: respaldar

concurrency:
  group: respaldo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  respaldar:
    name: respaldar
    if: github.event.schedule == '0 6 * * *' || inputs.tarea == 'respaldar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # solo para el último paso
    steps:
      - uses: actions/checkout@v5
      - name: Respaldar la base y las fotos
        env:
          RESPALDO_DB_URL: ${{ secrets.RESPALDO_DB_URL }}
          AGE_DESTINATARIO: ${{ vars.AGE_DESTINATARIO }}
          CAJA_ENDPOINT: ${{ vars.CAJA_ENDPOINT }}
          CAJA_BUCKET: ${{ vars.CAJA_BUCKET }}
          CAJA_ACCESS_KEY_ID: ${{ secrets.CAJA_ACCESS_KEY_ID }}
          CAJA_SECRET_ACCESS_KEY: ${{ secrets.CAJA_SECRET_ACCESS_KEY }}
          FOTOS_ENDPOINT: ${{ vars.FOTOS_ENDPOINT }}
          FOTOS_REGION: ${{ vars.FOTOS_REGION }}
          FOTOS_ACCESS_KEY_ID: ${{ secrets.FOTOS_ACCESS_KEY_ID }}
          FOTOS_SECRET_ACCESS_KEY: ${{ secrets.FOTOS_SECRET_ACCESS_KEY }}
        run: bash supabase/respaldo/en-contenedor.sh respaldar.sh
      # GitHub apaga los workflows programados de un repo público que pasa 60 días sin actividad.
      # Volver a habilitarlo después de cada respaldo reinicia esa cuenta.
      - name: Que GitHub no apague el respaldo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/respaldo.yml/enable"

  probar:
    name: probar
    if: github.event.schedule == '0 12 1 * *' || inputs.tarea == 'probar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Una base descartable con las migraciones (Supabase local)
        run: pnpm exec supabase start -x studio,mailpit,imgproxy
      - name: Restaurar el último respaldo y comparar con lo que se respaldó
        env:
          RED_DOCKER: supabase_network_mostrador-lois
          RESTAURAR_DB_URL: postgresql://postgres:postgres@db:5432/postgres
          AGE_IDENTIDAD: ${{ secrets.AGE_IDENTIDAD }}
          CAJA_ENDPOINT: ${{ vars.CAJA_ENDPOINT }}
          CAJA_BUCKET: ${{ vars.CAJA_BUCKET }}
          CAJA_ACCESS_KEY_ID: ${{ secrets.CAJA_ACCESS_KEY_ID }}
          CAJA_SECRET_ACCESS_KEY: ${{ secrets.CAJA_SECRET_ACCESS_KEY }}
        run: bash supabase/respaldo/en-contenedor.sh probar.sh
