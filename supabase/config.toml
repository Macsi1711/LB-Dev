# Supabase local de Mostrador Lois. Solo lo que cambia respecto de los defaults de la CLI.
# Puertos 55420-55429 para no chocar con otros proyectos de la máquina.
project_id = "mostrador-lois"

[api]
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false
port = 55429

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-usuarios.sql"]

[studio]
port = 55423

[local_smtp]
port = 55424

[auth]
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://localhost:5180/**", "http://127.0.0.1:5180/**"]
# Sin registro público: los usuarios los invita el admin. OJO: no poner
# [auth.email] enable_signup = false, porque eso apaga también el login por email.
enable_signup = false

# Servicios que la app no usa.
[realtime]
enabled = false

[storage]
# Fotos de los artículos (ADR-008). Va por Kong (55421): no suma puertos.
enabled = true

[edge_runtime]
enabled = false
inspector_port = 55428

[analytics]
enabled = false
port = 55427
