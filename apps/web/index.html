<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Mostrador Lois</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo.
      try {
        const t = localStorage.getItem('tema');
        const dark = t ? t === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="sin-arranque" hidden style="font-family: sans-serif; padding: 24px; max-width: 40em">
      <h1>No se pudo abrir el Mostrador en este navegador</h1>
      <p>Probá recargar la página. Si sigue igual, mandale una foto de esta pantalla a soporte.</p>
      <p><small id="sin-arranque-navegador"></small></p>
    </div>
    <script>
      // ES5 a propósito: si la app no arranca (navegador viejo, error al cargar), en vez de una
      // pantalla en blanco queda un aviso con el navegador para poder diagnosticarlo.
      (function () {
        function avisar() {
          var root = document.getElementById('root');
          var aviso = document.getElementById('sin-arranque');
          if (!root || !aviso || root.childNodes.length) return;
          document.getElementById('sin-arranque-navegador').textContent = navigator.userAgent;
          aviso.hidden = false;
        }
        window.addEventListener('error', function () {
          setTimeout(avisar, 0);
        });
        setTimeout(avisar, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
